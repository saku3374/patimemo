<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CZ到達率</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f2f2f7;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding-bottom:30px;}
.header{background:#1c1c1e;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:15px;font-weight:600;color:#fff;}
.btn-add-h{background:#2c2c2e;color:#0a84ff;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;}
.btn-add-h:active{opacity:0.7;}

/* 総CZバッジ */
.summary{margin:12px 12px 8px;background:#1c1c1e;border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.summary-label{font-size:12px;color:#8e8e93;}
.summary-val{font-size:22px;font-weight:700;color:#fff;}
.summary-sub{font-size:11px;color:#636366;margin-top:1px;}

/* テーブル */
.tbl-wrap{margin:0 12px;}
.tbl{width:100%;border-collapse:separate;border-spacing:0;}
/* ヘッダ行 */
.tbl thead tr{background:#3a3a3c;}
.tbl thead th{font-size:11px;color:#ebebf5;font-weight:500;padding:8px 4px;text-align:center;}
.tbl thead th:first-child{text-align:left;padding-left:12px;border-radius:10px 0 0 0;}
.tbl thead th:last-child{border-radius:0 10px 0 0;}

/* データ行 */
.tbl tbody tr{background:#fff;}
.tbl tbody tr:nth-child(even){background:#f9f9fb;}
.tbl tbody td{padding:9px 4px;vertical-align:middle;border-bottom:1px solid #e5e5ea;}
.tbl tbody td:first-child{padding-left:12px;}
.tbl tbody td:last-child{padding-right:8px;}
.tbl tbody tr:last-child td{border-bottom:none;}
.tbl tbody tr:last-child td:first-child{border-radius:0 0 0 10px;}
.tbl tbody tr:last-child td:last-child{border-radius:0 0 10px 0;}

.pt-label{font-size:15px;font-weight:700;color:#1c1c1e;white-space:nowrap;}
.pt-unit{font-size:10px;color:#8e8e93;}

/* 振り分け列 */
.furi-cell{text-align:center;}
.furi-pct{font-size:14px;font-weight:700;color:#1c1c1e;}
.furi-frac{font-size:10px;color:#8e8e93;margin-top:1px;}
.furi-bar-wrap{height:4px;background:#e5e5ea;border-radius:2px;margin-top:3px;width:100%;}
.furi-bar{height:100%;border-radius:2px;background:#0a84ff;transition:width 0.3s;}

/* 到達列 */
.tachi-cell{text-align:center;}
.tachi-pct{font-size:12px;font-weight:600;color:#3a3a3c;}
.tachi-frac{font-size:10px;color:#8e8e93;margin-top:1px;}

/* ボタン */
.btn-tachi{background:#1c1c1e;color:#fff;border:none;border-radius:8px;padding:9px 0;font-size:12px;font-weight:700;width:100%;min-width:52px;}
.btn-tachi:active{background:#3a3a3c;}
.adj-cell{white-space:nowrap;text-align:center;}
.btn-m{background:#e9e9eb;color:#1c1c1e;border:none;border-radius:7px;width:30px;height:30px;font-size:18px;font-weight:400;line-height:1;}
.btn-m:active{background:#d1d1d6;}
.btn-p{background:#e9e9eb;color:#1c1c1e;border:none;border-radius:7px;width:30px;height:30px;font-size:18px;font-weight:400;line-height:1;margin-left:3px;}
.btn-p:active{background:#d1d1d6;}
.del-btn{background:none;border:none;color:#c7c7cc;font-size:14px;padding:4px;}
.del-btn:active{color:#ff3b30;}
.btn-undo{background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:7px;width:30px;height:30px;font-size:14px;line-height:1;margin-right:3px;}
.btn-undo:active{background:#ffe69c;}
.btn-undo:disabled{background:#f5f5f5;color:#c7c7cc;border-color:#e5e5ea;}

/* フッター */
.footer-btns{display:flex;gap:10px;padding:10px 12px 0;}
.btn-reset{flex:1;background:#fff;color:#ff3b30;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;}
.btn-reset:active{background:#fee;}

/* 追加パネル */
.add-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;}
.add-overlay.open{display:flex;align-items:flex-end;}
.add-sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;}
.add-sheet h3{font-size:16px;font-weight:700;color:#1c1c1e;margin-bottom:14px;text-align:center;}
.add-sheet input{width:100%;background:#f2f2f7;border:none;border-radius:10px;padding:14px;font-size:20px;text-align:center;color:#1c1c1e;margin-bottom:12px;}
.btn-do-add{width:100%;background:#1c1c1e;color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-bottom:8px;}
.btn-do-add:active{opacity:0.8;}
.btn-cancel{width:100%;background:#f2f2f7;color:#1c1c1e;border:none;border-radius:12px;padding:15px;font-size:16px;}
.btn-cancel:active{background:#e5e5ea;}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;z-index:200;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
/* 保存エリア */
.save-area{margin:12px 12px 0;}
.save-row{display:flex;gap:8px;margin-bottom:10px;}
.save-inp{flex:1;background:#fff;color:#1c1c1e;border:1px solid #d1d1d6;border-radius:10px;padding:10px 12px;font-size:16px;}
.save-inp:focus{outline:2px solid #1c1c1e;border-color:#1c1c1e;}
.btn-save{background:#1c1c1e;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;white-space:nowrap;}
.btn-save:active{background:#3a3a3c;}
.lst-title{font-size:12px;color:#8e8e93;font-weight:500;margin-bottom:6px;}
.lst-empty{font-size:13px;color:#c7c7cc;text-align:center;padding:14px 0;}
.litem{background:#fff;border-radius:10px;display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;}
.litem-info{flex:1;min-width:0;}
.litem-name{font-size:14px;font-weight:600;color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.litem-sub{font-size:11px;color:#8e8e93;margin-top:2px;}
.btn-lload{background:#2c2c2e;color:#fff;border:none;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:600;white-space:nowrap;}
.btn-lload:active{opacity:0.7;}
.btn-ldel{background:none;border:none;color:#c7c7cc;font-size:18px;padding:4px 6px;line-height:1;}
.btn-ldel:active{color:#ff3b30;}
</style>
</head>
<body>
<div class="header">
  <h1>CZ到達率</h1>
  <button class="btn-add-h" onclick="openAdd()">＋ 追加</button>
</div>

<div class="summary">
  <div>
    <div class="summary-label">総CZ回数</div>
    <div class="summary-sub">（振り分けの分母）</div>
  </div>
  <div style="text-align:right;">
    <div class="summary-val" id="totalCZ">0</div>
    <div class="summary-sub" id="totalTrials">試行 0回</div>
  </div>
</div>

<div class="tbl-wrap">
  <table class="tbl">
    <thead>
      <tr>
        <th style="width:52px;">規定</th>
        <th style="width:72px;">振り分け</th>
        <th style="width:62px;">到達率</th>
        <th style="width:52px;">到達</th>
        <th style="width:70px;">試行 ±</th>
        <th style="width:24px;"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer-btns">
  <button class="btn-reset" onclick="resetAll()">全リセット</button>
</div>

<div class="save-area">
  <div class="save-row">
    <input type="text" class="save-inp" id="saveInp" placeholder="名前を入力して保存（例：5/18 設定6）" maxlength="30">
    <button class="btn-save" onclick="saveSlot()">保存</button>
  </div>
  <div class="lst-title">保存リスト</div>
  <div id="lstArea"></div>
</div>

<div class="add-overlay" id="addOverlay" onclick="overlayClick(event)">
  <div class="add-sheet" onclick="stopProp(event)">
    <h3>規定ポイントを追加</h3>
    <input type="number" id="newPt" placeholder="例: 350" inputmode="numeric">
    <button class="btn-do-add" onclick="doAdd()">追加する</button>
    <button class="btn-cancel" onclick="closeAdd()">キャンセル</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var DEFAULT_PTS = [100, 200, 300, 400, 500];
var state = {pts: [], data: {}};

function load() {
  var saved = localStorage.getItem('czc4');
  if (saved) {
    try {
      var p = JSON.parse(saved);
      state.pts = p.pts || DEFAULT_PTS.slice();
      state.data = p.data || {};
    } catch(e) {
      state.pts = DEFAULT_PTS.slice();
      state.data = {};
    }
  } else {
    state.pts = DEFAULT_PTS.slice();
    state.data = {};
  }
  state.pts.sort(function(a, b) { return a - b; });
  state.pts.forEach(function(pt) {
    if (!state.data[pt]) state.data[pt] = {s: 0, t: 0};
  });
}

function save() {
  localStorage.setItem('czc4', JSON.stringify(state));
}

function totalS() {
  var n = 0;
  state.pts.forEach(function(pt) {
    n += (state.data[pt] ? state.data[pt].s : 0);
  });
  return n;
}

function maxT() {
  var n = 0;
  state.pts.forEach(function(pt) {
    var t = state.data[pt] ? state.data[pt].t : 0;
    if (t > n) n = t;
  });
  return n;
}

function pctStr(a, b) {
  if (b === 0) return '-';
  return Math.round(a / b * 100) + '%';
}

function render() {
  var ts = totalS();
  var mt = maxT();
  document.getElementById('totalCZ').textContent = ts;
  document.getElementById('totalTrials').textContent = '試行 ' + mt + '回';

  var html = '';
  state.pts.forEach(function(pt) {
    var d = state.data[pt] || {s: 0, t: 0};
    var furiPct = ts > 0 ? Math.round(d.s / ts * 100) : 0;
    var furiStr = ts > 0 ? (Math.round(d.s / ts * 1000) / 10) + '%' : '-';
    var tachiStr = pctStr(d.s, d.t);
    html += '<tr>';
    html += '<td><span class="pt-label">' + pt + '</span><span class="pt-unit">pt</span></td>';
    /* 振り分け */
    html += '<td class="furi-cell">';
    html += '<div class="furi-pct">' + furiStr + '</div>';
    html += '<div class="furi-frac">(' + d.s + '/' + ts + ')</div>';
    html += '<div class="furi-bar-wrap"><div class="furi-bar" style="width:' + furiPct + '%;"></div></div>';
    html += '</td>';
    /* 到達率 */
    html += '<td class="tachi-cell">';
    html += '<div class="tachi-pct">' + tachiStr + '</div>';
    html += '<div class="tachi-frac">(' + d.s + '/' + d.t + ')</div>';
    html += '</td>';
    /* 到達ボタン */
    html += '<td><button class="btn-tachi" onclick="czHit(' + pt + ')">到達</button></td>';
    /* 取り消し＋試行± */
    var canUndo = d.s > 0;
    html += '<td class="adj-cell">';
    html += '<button class="btn-undo" onclick="czUndo(' + pt + ')" ' + (canUndo ? '' : 'disabled') + '>↩</button>';
    html += '<button class="btn-m" onclick="adjT(' + pt + ',-1)">－</button>';
    html += '<button class="btn-p" onclick="adjT(' + pt + ',1)">＋</button>';
    html += '</td>';
    /* 削除 */
    html += '<td><button class="del-btn" onclick="delPt(' + pt + ')">✕</button></td>';
    html += '</tr>';
  });
  if (state.pts.length === 0) {
    html = '<tr><td colspan="6" style="text-align:center;color:#8e8e93;padding:30px;font-size:14px;">＋追加からポイントを設定</td></tr>';
  }
  document.getElementById('tbody').innerHTML = html;
}

function czHit(threshold) {
  state.pts.forEach(function(pt) {
    if (!state.data[pt]) state.data[pt] = {s: 0, t: 0};
    if (pt < threshold) {
      state.data[pt].t += 1;
    } else if (pt === threshold) {
      state.data[pt].s += 1;
      state.data[pt].t += 1;
    }
  });
  save();
  render();
  toast(threshold + 'pt 到達！');
}

function czUndo(threshold) {
  if (!state.data[threshold] || state.data[threshold].s <= 0) return;
  state.pts.forEach(function(pt) {
    if (!state.data[pt]) return;
    if (pt < threshold) {
      state.data[pt].t = Math.max(0, state.data[pt].t - 1);
    } else if (pt === threshold) {
      state.data[pt].s = Math.max(0, state.data[pt].s - 1);
      state.data[pt].t = Math.max(0, state.data[pt].t - 1);
    }
  });
  save();
  render();
  toast(threshold + 'pt の到達を1回取り消し');
}

function adjT(pt, delta) {
  if (!state.data[pt]) state.data[pt] = {s: 0, t: 0};
  state.data[pt].t = Math.max(0, state.data[pt].t + delta);
  if (state.data[pt].s > state.data[pt].t) state.data[pt].s = state.data[pt].t;
  save();
  render();
}

function delPt(pt) {
  var idx = state.pts.indexOf(pt);
  if (idx >= 0) state.pts.splice(idx, 1);
  delete state.data[pt];
  save();
  render();
}

function openAdd() {
  document.getElementById('addOverlay').className = 'add-overlay open';
  setTimeout(function() { document.getElementById('newPt').focus(); }, 100);
}
function overlayClick(e) {
  if (e.target === document.getElementById('addOverlay')) closeAdd();
}
function stopProp(e) { e.stopPropagation(); }
function closeAdd() {
  document.getElementById('addOverlay').className = 'add-overlay';
  document.getElementById('newPt').value = '';
}
function doAdd() {
  var v = parseInt(document.getElementById('newPt').value);
  if (!v || v <= 0) { toast('正しい数値を入力してください'); return; }
  if (state.pts.indexOf(v) >= 0) { toast(v + 'pt はすでにあります'); return; }
  state.pts.push(v);
  state.pts.sort(function(a, b) { return a - b; });
  state.data[v] = {s: 0, t: 0};
  closeAdd();
  save();
  render();
  toast(v + 'pt 追加しました');
}
function resetAll() {
  state.pts.forEach(function(pt) { state.data[pt] = {s: 0, t: 0}; });
  save();
  render();
  toast('リセットしました');
}
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.className = 'toast'; }, 1600);
}

/* ===== 保存リスト ===== */
function loadSlots() {
  try { var s = localStorage.getItem('czc4_slots'); return s ? JSON.parse(s) : []; }
  catch(e) { return []; }
}
function saveSlots(arr) {
  try { localStorage.setItem('czc4_slots', JSON.stringify(arr)); } catch(e) {}
}
function saveSlot() {
  var name = document.getElementById('saveInp').value.trim();
  if (!name) { toast('名前を入力してください'); return; }
  var ts = totalS();
  var mt = maxT();
  var slots = loadSlots();
  slots.unshift({
    name: name,
    ts: ts,
    mt: mt,
    pts: state.pts.slice(),
    data: JSON.parse(JSON.stringify(state.data)),
    at: new Date().toLocaleString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
  });
  saveSlots(slots);
  document.getElementById('saveInp').value = '';
  renderSlots();
  toast('"' + name + '" を保存しました');
}
function loadSlot(idx) {
  var slots = loadSlots();
  var s = slots[idx];
  if (!s) return;
  state.pts = s.pts.slice();
  state.data = JSON.parse(JSON.stringify(s.data));
  save();
  render();
  toast('"' + s.name + '" を呼び出しました');
}
function delSlot(idx) {
  var slots = loadSlots();
  var name = slots[idx] ? slots[idx].name : '';
  slots.splice(idx, 1);
  saveSlots(slots);
  renderSlots();
  toast('"' + name + '" を削除しました');
}
function renderSlots() {
  var slots = loadSlots();
  var el = document.getElementById('lstArea');
  if (slots.length === 0) {
    el.innerHTML = '<div class="lst-empty">保存データがありません</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < slots.length; i++) {
    var s = slots[i];
    html += '<div class="litem">';
    html += '<div class="litem-info">';
    html += '<div class="litem-name">' + s.name + '</div>';
    html += '<div class="litem-sub">CZ ' + s.ts + '回 / 試行 ' + s.mt + '回　' + s.at + '</div>';
    html += '</div>';
    html += '<button class="btn-lload" onclick="loadSlot(' + i + ')">呼出</button>';
    html += '<button class="btn-ldel" onclick="delSlot(' + i + ')">✕</button>';
    html += '</div>';
  }
  el.innerHTML = html;
}
document.getElementById('newPt').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAdd();
});
load();
render();
renderSlots();
</script>
</body>
</html>
