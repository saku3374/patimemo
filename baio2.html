<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BIO3 フィギュア割合</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#1a1a1a;color:#eee;font-size:16px;padding:8px 6px 20px}
.hd{background:linear-gradient(135deg,#8b0000,#c0392b);color:#fff;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-bottom:8px}
.hd .sub{font-size:11px;font-weight:normal;opacity:0.9;margin-top:2px}
.lgd{display:flex;justify-content:center;gap:8px;font-size:10px;color:#bbb;margin-bottom:8px;flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center;gap:3px}
.lgd i{width:8px;height:8px;border-radius:2px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:8px}
.cell{background:#2a2a2a;border-radius:6px;padding:4px 3px;text-align:center;display:flex;flex-direction:column;border-top:3px solid #555;min-height:140px}
.pair{grid-column:span 2}
.single{grid-column:span 1}
.cell.gA{border-top-color:#4299e1}
.cell.gB{border-top-color:#f56565}
.cell.gC{border-top-color:#ecc94b}
.cell.gD{border-top-color:#48bb78}
.cell.gE{border-top-color:#9f7aea}
.h{font-size:9px;color:#999;line-height:1.1;height:11px;overflow:hidden;white-space:nowrap}
.nor{display:flex;gap:3px;justify-content:center;font-size:13px;font-weight:bold;color:#ddd;height:16px;line-height:16px;margin-top:1px}
.nor>*{flex:1}
.br{display:flex;gap:3px;margin-top:2px}
.br>*{flex:1;min-width:0}
.pls{height:26px;background:#3a5f7d;color:#fff;border:none;border-radius:3px;font-size:16px;font-weight:bold;line-height:1;padding:0;touch-action:manipulation}
.pls:active{background:#2a4d68}
.inp{height:30px;width:100%;text-align:center;background:#444;color:#fff;border:none;border-radius:3px;font-size:16px;font-weight:bold;padding:0;-moz-appearance:textfield;user-select:text;-webkit-user-select:text}
.inp::-webkit-outer-spin-button,.inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inp:focus{outline:2px solid #f1c40f;background:#555}
.mns{height:18px;background:#3a2d2d;color:#aaa;border:none;border-radius:3px;font-size:12px;line-height:1;padding:0;touch-action:manipulation}
.mns:active{background:#1a1717}
.pct{font-size:12px;font-weight:bold;color:#f1c40f;margin-top:auto;padding-top:4px;height:18px;line-height:18px}
.tot{background:#2a2a2a;border-radius:8px;padding:10px;text-align:center;font-size:14px;color:#f1c40f;font-weight:bold;margin:8px 0}
.sum{background:#2a2a2a;border-radius:8px;padding:12px;margin-top:10px}
.sum h2{font-size:14px;margin-bottom:10px;color:#f1c40f;border-left:3px solid #f1c40f;padding-left:8px}
.bar{margin:8px 0}
.bar-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:3px;gap:4px}
.bar-top .lbl{font-weight:bold;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-top .val{color:#aaa;font-variant-numeric:tabular-nums;flex-shrink:0}
.bar-pct{height:12px;background:#444;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.rst{width:100%;padding:12px;background:#555;color:#fff;border:none;border-radius:6px;font-size:14px;margin-top:14px;font-weight:bold;touch-action:manipulation}
.rst:active{background:#333}
.note{font-size:10px;color:#888;text-align:center;margin-top:6px;line-height:1.5}
.titrow{display:flex;gap:6px;margin-bottom:8px}
.titinp{flex:1;height:38px;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:6px;padding:0 10px;font-size:16px}
.titinp:focus{outline:2px solid #f1c40f;border-color:#f1c40f}
.savbtn{height:38px;padding:0 14px;background:#2d6a4f;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:bold;flex-shrink:0;touch-action:manipulation}
.savbtn:active{background:#1b4332}
.lst{background:#2a2a2a;border-radius:8px;padding:12px;margin-top:10px}
.lst h2{font-size:14px;margin-bottom:10px;color:#f1c40f;border-left:3px solid #f1c40f;padding-left:8px}
.litem{background:#333;border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.litem-info{flex:1;min-width:0}
.litem-ttl{font-size:13px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem-sub{font-size:11px;color:#999;margin-top:2px}
.litem-load{height:30px;padding:0 10px;background:#3a5f7d;color:#fff;border:none;border-radius:4px;font-size:12px;flex-shrink:0;touch-action:manipulation}
.litem-load:active{background:#2a4d68}
.litem-del{width:30px;height:30px;background:#5a2d2d;color:#f56565;border:none;border-radius:4px;font-size:16px;flex-shrink:0;touch-action:manipulation}
.litem-del:active{background:#3a1d1d}
.nolist{font-size:12px;color:#888;text-align:center;padding:10px 0}
.bfloat{position:fixed;left:8px;top:38%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;z-index:90}
.bfloat-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bfloat-lbl{font-size:10px;color:#bbb;background:rgba(30,30,30,0.85);border-radius:4px;padding:2px 6px}
.bfloat-plus{width:110px;height:54px;background:#2d6a4f;color:#fff;border:none;border-radius:12px;font-size:28px;font-weight:bold;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,0.6);touch-action:manipulation}
.bfloat-plus:active{background:#1b4332;transform:scale(0.95)}
.bfloat-cnt{width:110px;height:32px;background:#2a2a2a;color:#fff;border:2px solid #555;border-radius:8px;font-size:18px;font-weight:bold;text-align:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,0.4);touch-action:manipulation}
.bfloat-cnt:active{background:#444}
.bfloat-minus{width:110px;height:26px;background:#3a2020;color:#f56565;border:none;border-radius:8px;font-size:14px;font-weight:bold;touch-action:manipulation}
.bfloat-minus:active{background:#5a2d2d}
.bfloat-sep{height:16px}
.bfloat-gplus{width:110px;height:44px;background:#1a3a5f;color:#fff;border:none;border-radius:12px;font-size:22px;font-weight:bold;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,0.6);touch-action:manipulation}
.bfloat-gplus:active{background:#0f2a4a;transform:scale(0.95)}
.bfloat-rate{font-size:13px;color:#f1c40f;font-weight:bold;text-align:center;background:rgba(30,30,30,0.85);border-radius:4px;padding:2px 4px;width:110px}
.bfloat-hint{font-size:10px;color:#aaa;text-align:center;width:110px}
.bfsett{width:82px;margin-top:0}
.bfsett-row{display:flex;align-items:center;gap:2px;margin:2px 0}
.bfsett-s{font-size:10px;width:12px;flex-shrink:0;text-align:right;font-weight:bold}
.bfsett-bar{flex:1;height:8px;background:#333;border-radius:2px;overflow:hidden}
.bfsett-fill{height:100%;border-radius:2px}
.bfsett-p{font-size:10px;width:24px;text-align:right;flex-shrink:0}
.gnum-wrap{display:flex;flex-direction:row;gap:8px;align-items:flex-start}
.gnum-col{display:flex;flex-direction:column;align-items:center;gap:4px}
#bfBody{max-height:58vh;overflow-y:auto}
.bftab{background:rgba(40,40,40,0.9);color:#bbb;border:1px solid #555;border-radius:6px;font-size:12px;padding:4px 8px;touch-action:manipulation;white-space:nowrap}
.bftab:active{background:#555}
.npback{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:101;background:rgba(0,0,0,0.4)}
.npd{display:none;position:fixed;left:0;bottom:0;width:220px;background:#1e1e1e;border-top:2px solid #555;border-right:2px solid #555;border-radius:0 12px 0 0;z-index:102;padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.npd-disp{height:42px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:26px;font-weight:bold;color:#fff;background:#333;border-radius:6px;margin-bottom:6px}
.npd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.npd-key{height:60px;background:#3a3a3a;color:#fff;border:none;border-radius:8px;font-size:26px;font-weight:bold;touch-action:manipulation}
.npd-key:active{background:#555}
.npd-ok{background:#2d6a4f}
.npd-ok:active{background:#1b4332}
.npd-del{background:#5a2d2d;color:#f56565}
.npd-del:active{background:#3a1d1d}
</style>
</head>
<body>
<div class="hd">バイオハザード RE:3<div class="sub">フィギュアコレクション 割合判別</div></div>
<div class="lgd">
<span><i style="background:#4299e1"></i>奇数</span>
<span><i style="background:#f56565"></i>偶数</span>
<span><i style="background:#ecc94b"></i>高設定</span>
<span><i style="background:#48bb78"></i>1否定</span>
<span><i style="background:#9f7aea"></i>4↑</span>
</div>
<div class="titrow">
<input type="text" class="titinp" id="titinp" placeholder="タイトル（例：5/15 設定2）" maxlength="30">
<button class="savbtn" onclick="saveSlot()">保存</button>
</div>
<div class="grid" id="grid"></div>
<div class="tot" id="tot">合計: 0 個</div>
<div class="sum">
<h2>📊 1-8 / 9-16</h2>
<div id="rat89"></div>
</div>

<div class="sum">
<h2>📊 ざっくり割合</h2>
<div id="ratB"></div>
</div>

<div class="note">数字を直接タップでまとめ入力も可</div>
<button class="rst" id="rstBtn" onclick="resetAll()">リセット</button>

<div class="lst">
<h2>💾 保存リスト</h2>
<div id="lstArea"></div>
</div>

<div class="npback" id="npback" onclick="closeNp()"></div>
<div class="npd" id="npd">
<div class="npd-disp" id="npDisp">0</div>
<div class="npd-grid">
<button class="npd-key" onclick="npKey('7')">7</button>
<button class="npd-key" onclick="npKey('8')">8</button>
<button class="npd-key" onclick="npKey('9')">9</button>
<button class="npd-key" onclick="npKey('4')">4</button>
<button class="npd-key" onclick="npKey('5')">5</button>
<button class="npd-key" onclick="npKey('6')">6</button>
<button class="npd-key" onclick="npKey('1')">1</button>
<button class="npd-key" onclick="npKey('2')">2</button>
<button class="npd-key" onclick="npKey('3')">3</button>
<button class="npd-key npd-del" onclick="npKey('del')">C</button>
<button class="npd-key" onclick="npKey('0')">0</button>
<button class="npd-key npd-ok" onclick="npKey('ok')">OK</button>
</div>
</div>
<div class="bfloat">
<button class="bftab" id="bfTab" onclick="toggleFloat()">ベル ▶</button>
<div id="bfBody" style="display:none;flex-direction:column;gap:4px;margin-top:4px">
<div class="bfloat-lbl">ベル</div>
<button class="bfloat-cnt" id="fBell" onclick="openNp('bell')">0</button>
<button class="bfloat-plus" onclick="incBell()">+</button>
<button class="bfloat-minus" onclick="decBell()">−</button>
<div class="bfloat-sep"></div>
<div class="gnum-wrap">
<div class="gnum-col">
<div class="bfloat-lbl">G数</div>
<button class="bfloat-cnt" id="fGnum" onclick="openNp('gnum')">0</button>
<button class="bfloat-gplus" onclick="incGnum()">+</button>
<button class="bfloat-minus" onclick="decGnum()">−</button>
<div class="bfloat-rate" id="fRate">-</div>
</div>
<div class="bfsett" id="bfSett"></div>
</div>
</div>
</div>
<script>
var circles=["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯"];

var grp=[
{lbl:"奇数(弱)",ns:[1,2],cls:"pair gA"},
{lbl:"奇数(強)",ns:[3,4],cls:"pair gA"},
{lbl:"偶数(弱)",ns:[5,6],cls:"pair gB"},
{lbl:"偶数(強)",ns:[7,8],cls:"pair gB"},
{lbl:"高(弱)",ns:[9,10],cls:"pair gC"},
{lbl:"高(中)",ns:[11,12],cls:"pair gC"},
{lbl:"高(強)",ns:[13],cls:"single gC"},
{lbl:"1否定",ns:[14],cls:"single gD"},
{lbl:"4↑[16]",ns:[15],cls:"single gE"},
{lbl:"4↑[15]",ns:[16],cls:"single gE"}
];

var cnt={};
for(var i=1;i<=16;i++)cnt[i]=0;

function load(){
try{
var s=localStorage.getItem("bio3_figs");
if(s){var d=JSON.parse(s);for(var k in d){if(cnt[k]!==undefined)cnt[k]=parseInt(d[k])||0}}
}catch(e){}
}

function save(){
try{localStorage.setItem("bio3_figs",JSON.stringify(cnt))}catch(e){}
}

function render(){
var html="";
for(var i=0;i<grp.length;i++){
var g=grp[i];
html+='<div class="cell '+g.cls+'">';
html+='<div class="h">'+g.lbl+'</div>';
html+='<div class="nor">';
for(var j=0;j<g.ns.length;j++){
html+='<div>'+circles[g.ns[j]-1]+'</div>';
}
html+='</div>';
html+='<div class="br">';
for(var j=0;j<g.ns.length;j++){
html+='<button class="pls" onclick="inc('+g.ns[j]+')">+</button>';
}
html+='</div>';
html+='<div class="br">';
for(var j=0;j<g.ns.length;j++){
var n=g.ns[j];
html+='<input type="tel" inputmode="numeric" pattern="[0-9]*" class="inp" id="c'+n+'" value="'+cnt[n]+'" oninput="setC('+n+',this.value)" onfocus="this.select()">';
}
html+='</div>';
html+='<div class="br">';
for(var j=0;j<g.ns.length;j++){
html+='<button class="mns" onclick="dec('+g.ns[j]+')">−</button>';
}
html+='</div>';
html+='<div class="pct" id="p'+i+'">0.0%</div>';
html+='</div>';
}
document.getElementById("grid").innerHTML=html;
updateStats();
}

function inc(n){
cnt[n]++;
if(cnt[n]>999)cnt[n]=999;
save();
var el=document.getElementById("c"+n);
if(el)el.value=cnt[n];
updateStats();
}

function dec(n){
if(cnt[n]>0){
cnt[n]--;
save();
var el=document.getElementById("c"+n);
if(el)el.value=cnt[n];
updateStats();
}
}

function setC(n,v){
var x=parseInt(v);
if(isNaN(x)||x<0)x=0;
if(x>999)x=999;
cnt[n]=x;
save();
updateStats();
}

var rs=0;
function resetAll(){
var b=document.getElementById("rstBtn");
if(rs===0){
b.textContent="もう一度押すと削除";
b.style.background="#c0392b";
rs=1;
setTimeout(function(){
if(rs===1){
b.textContent="リセット";
b.style.background="#555";
rs=0;
}
},3000);
return;
}
for(var i=1;i<=16;i++){
cnt[i]=0;
var el=document.getElementById("c"+i);
if(el)el.value=0;
}
save();
updateStats();
bell=0;gnum=0;
saveFtr();
updateFtr();
b.textContent="リセット";
b.style.background="#555";
rs=0;
}

function updateStats(){
var total=0;
for(var i=1;i<=16;i++)total+=cnt[i];
document.getElementById("tot").textContent="合計: "+total+" 個";

for(var i=0;i<grp.length;i++){
var g=grp[i];
var sum=0;
for(var j=0;j<g.ns.length;j++)sum+=cnt[g.ns[j]];
var pct=total>0?(sum/total*100):0;
var el=document.getElementById("p"+i);
if(el)el.textContent=sum+" / "+pct.toFixed(1)+"%";
}

var g89=[
{l:"1-8 奇数・偶数",n:[1,2,3,4,5,6,7,8],c:"#63b3ed"},
{l:"9-16 高設定・特殊",n:[9,10,11,12,13,14,15,16],c:"#f6ad55"}
];

document.getElementById("rat89").innerHTML=mkBars(g89,total);

var gB=[
{l:"1-4 奇数系",n:[1,2,3,4],c:"#4299e1"},
{l:"5-8 偶数系",n:[5,6,7,8],c:"#f56565"},
{l:"9-12 高設定系",n:[9,10,11,12],c:"#ecc94b"},
{l:"13 高(強)",n:[13],c:"#b7791f"},
{l:"14 1否定",n:[14],c:"#48bb78"},
{l:"15 ジル感染",n:[15],c:"#9f7aea"},
{l:"16 カルロス感染",n:[16],c:"#805ad5"}
];

document.getElementById("ratB").innerHTML=mkBars(gB,total);
}

function mkBars(groups,total){
var html="";
for(var i=0;i<groups.length;i++){
var g=groups[i];
var sum=0;
for(var j=0;j<g.n.length;j++)sum+=cnt[g.n[j]];
var pct=total>0?(sum/total*100):0;
html+='<div class="bar">';
html+='<div class="bar-top"><span class="lbl">'+g.l+'</span><span class="val">'+sum+'個 / '+pct.toFixed(1)+'%</span></div>';
html+='<div class="bar-pct"><div class="bar-fill" style="width:'+pct.toFixed(1)+'%;background:'+g.c+'"></div></div>';
html+='</div>';
}
return html;
}

function loadSlots(){
try{var s=localStorage.getItem("bio3_slots");return s?JSON.parse(s):[]}catch(e){return []}
}

function saveSlots(arr){
try{localStorage.setItem("bio3_slots",JSON.stringify(arr))}catch(e){}
}

function saveSlot(){
var t=document.getElementById("titinp").value.trim();
if(!t){alert("タイトルを入力してください");return;}
var total=0;
for(var i=1;i<=16;i++)total+=cnt[i];
var arr=loadSlots();
arr.unshift({title:t,cnt:JSON.parse(JSON.stringify(cnt)),total:total,ts:new Date().toLocaleDateString("ja-JP"),bell:bell,gnum:gnum});
if(arr.length>20)arr=arr.slice(0,20);
saveSlots(arr);
document.getElementById("titinp").value="";
renderList();
}

function loadSlot(idx){
var arr=loadSlots();
if(!arr[idx])return;
var d=arr[idx];
for(var k in d.cnt){if(cnt[k]!==undefined)cnt[k]=parseInt(d.cnt[k])||0;}
save();
for(var i=1;i<=16;i++){
var el=document.getElementById("c"+i);
if(el)el.value=cnt[i];
}
document.getElementById("titinp").value=d.title;
bell=d.bell||0;
gnum=d.gnum||0;
saveFtr();
updateFtr();
updateStats();
window.scrollTo(0,0);
}

function delSlot(idx){
var arr=loadSlots();
arr.splice(idx,1);
saveSlots(arr);
renderList();
}

function renderList(){
var arr=loadSlots();
var el=document.getElementById("lstArea");
if(!arr.length){el.innerHTML='<div class="nolist">まだ保存なし</div>';return;}
var html="";
for(var i=0;i<arr.length;i++){
var a=arr[i];
html+='<div class="litem">';
html+='<div class="litem-info"><div class="litem-ttl">'+a.title+'</div>';
html+='<div class="litem-sub">'+a.ts+' ／ 合計'+a.total+'個 ベル'+(a.bell||0)+'/'+(a.gnum||0)+'G</div></div>';
html+='<button class="litem-load" onclick="loadSlot('+i+')">呼出</button>';
html+='<button class="litem-del" onclick="delSlot('+i+')">×</button>';
html+='</div>';
}
el.innerHTML=html;
}

var bell=0;
var gnum=0;
var npTarget=null;
var npBuf='';

var bfOpen=false;
function toggleFloat(){
bfOpen=!bfOpen;
var body=document.getElementById("bfBody");
var tab=document.getElementById("bfTab");
body.style.display=bfOpen?"flex":"none";
tab.textContent=bfOpen?"ベル ◀":"ベル ▶";
try{localStorage.setItem("bio3_bfopen",bfOpen?"1":"0")}catch(e){}
}

function saveFtr(){
try{localStorage.setItem("bio3_ftr",JSON.stringify({bell:bell,gnum:gnum}))}catch(e){}
}

function loadFtr(){
try{
var s=localStorage.getItem("bio3_ftr");
if(s){var d=JSON.parse(s);bell=d.bell||0;gnum=d.gnum||0}
var o=localStorage.getItem("bio3_bfopen");
if(o==="1"){bfOpen=false;toggleFloat()}
}catch(e){}
}

function updateFtr(){
document.getElementById("fBell").textContent=bell;
document.getElementById("fGnum").textContent=gnum;
var settEl=document.getElementById("bfSett");
if(bell>0&&gnum>0){
var r=gnum/bell;
document.getElementById("fRate").textContent="1/"+r.toFixed(1);
var th=[22,21,20,19,18,17];
var sc=[];
var tot=0;
for(var i=0;i<6;i++){
var d=Math.abs(r-th[i]);
var s=1/(d+0.3);
sc.push(s);
tot+=s;
}
var pcts=[];
var maxP=0;
var maxI=0;
for(var i=0;i<6;i++){
pcts.push(sc[i]/tot*100);
if(pcts[i]>maxP){maxP=pcts[i];maxI=i;}
}
var html="";
for(var i=5;i>=0;i--){
var p=pcts[i];
var top=(i===maxI);
var clr=top?"#f1c40f":"#4a6fa5";
var tc=top?"#f1c40f":"#aaa";
html+='<div class="bfsett-row">';
html+='<div class="bfsett-s" style="color:'+tc+'">'+(i+1)+'</div>';
html+='<div class="bfsett-bar"><div class="bfsett-fill" style="width:'+p.toFixed(0)+'%;background:'+clr+'"></div></div>';
html+='<div class="bfsett-p" style="color:'+tc+'">'+p.toFixed(0)+'%</div>';
html+='</div>';
}
if(settEl)settEl.innerHTML=html;
}else{
document.getElementById("fRate").textContent="-";
if(settEl)settEl.innerHTML="";
}
}

function getHint(r){
if(r<17.5)return "設定6";
if(r<18.5)return "設定5-6";
if(r<19.5)return "設定4-5";
if(r<20.5)return "設定3-4";
if(r<21.5)return "設定2-3";
return "設定1-2";
}

function incBell(){bell++;saveFtr();updateFtr()}
function decBell(){if(bell>0){bell--;saveFtr();updateFtr()}}
function incGnum(){gnum++;saveFtr();updateFtr()}
function decGnum(){if(gnum>0){gnum--;saveFtr();updateFtr()}}

var npOrigVal=0;
function openNp(t){
npTarget=t;
npOrigVal=t==='bell'?bell:gnum;
npBuf=String(npOrigVal);
if(npBuf==='0')npBuf='';
document.getElementById(t==='bell'?'fBell':'fGnum').textContent=npBuf||'0';
document.getElementById("npDisp").textContent=npBuf||'0';
document.getElementById("npback").style.display="block";
document.getElementById("npd").style.display="block";
}

function closeNp(){
document.getElementById("npback").style.display="none";
document.getElementById("npd").style.display="none";
var el=document.getElementById(npTarget==='bell'?'fBell':'fGnum');
if(el)el.textContent=npOrigVal;
npTarget=null;
npBuf='';
}

function npKey(k){
if(k==='del'){
npBuf='';
}else if(k==='ok'){
var v=parseInt(npBuf)||0;
if(v<0)v=0;
if(npTarget==='bell')bell=v;
else gnum=v;
saveFtr();
updateFtr();
document.getElementById("npback").style.display="none";
document.getElementById("npd").style.display="none";
npTarget=null;
npBuf='';
return;
}else{
if(npBuf.length>=6)return;
npBuf+=k;
}
var el=document.getElementById(npTarget==='bell'?'fBell':'fGnum');
if(el)el.textContent=npBuf||'0';
document.getElementById("npDisp").textContent=npBuf||'0';
}

load();
render();
loadFtr();
updateFtr();
renderList();
</script>
</body>
</html>
