<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>セグ記録</title>
<style>
* { box-sizing: border-box; touch-action: manipulation; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #111; color: #eee; font-size: 16px; padding-bottom: 700px; padding-left: 148px; -webkit-text-size-adjust: 100%; }
#tabs { display: flex; overflow-x: auto; border-bottom: 2px solid #333; -webkit-overflow-scrolling: touch; }
.tab { flex: 0 0 auto; padding: 10px 14px; font-size: 13px; font-weight: bold; background: #1a1a1a; color: #666; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.tab.active { background: #222; color: #fff; border-bottom: 3px solid #f08; }
#list-area { padding: 10px 12px; }
#sort-btns { display: flex; gap: 6px; margin-bottom: 6px; }
.sbtn { flex: 1; padding: 7px 4px; font-size: 12px; border: 2px solid #333; border-radius: 6px; background: #1a1a1a; color: #777; cursor: pointer; text-align: center; }
.sbtn.active { border-color: #f08; color: #fff; background: #2a1020; }
#sort-label { font-size: 13px; color: #666; margin-bottom: 6px; }
.list-row { display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 8px; background: #1a1a1a; margin-bottom: 6px; }
.list-row.unsure { background: #1e1a08; }
.row-lamps { display: flex; gap: 2px; }
.rl { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
.rl.on { background: #e0193a; color: #fff; }
.rl.off { background: #222; color: #333; border: 1px solid #2a2a2a; }
.row-right { margin-left: auto; text-align: right; }
.row-result { font-size: 15px; font-weight: bold; color: #f08; }
.row-result.tenraku { color: #4af; }
.row-unsure { font-size: 11px; color: #a89030; }
.row-recorder { font-size: 11px; color: #88aacc; }
.del-btn { margin-left: 6px; padding: 4px 7px; background: #3a1a1a; color: #c88; font-size: 12px; border: 1px solid #5a2a2a; border-radius: 4px; cursor: pointer; flex-shrink: 0; }
.del-btn:active { background: #5a2020; }
.recorder-box { border: 1px solid #333; border-radius: 10px; padding: 8px; margin-bottom: 10px; }
.recorder-box-title { font-size: 13px; font-weight: bold; color: #88aacc; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #333; }
.group-label { font-size: 14px; font-weight: bold; color: #f08; padding: 8px 4px 4px; }
#bottom-btns { padding: 8px 12px 12px; display: flex; gap: 8px; }
#copy-btn { flex: 1; padding: 10px; background: #1a2a4a; color: #aac; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; }
#clear-btn { flex: 1; padding: 10px; background: #2a1a1a; color: #c88; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; }
#copy-msg { text-align: center; font-size: 13px; color: #4c8; height: 20px; }
#toggle-btn { position: fixed; left: 0; bottom: 30px; width: 140px; height: 28px; background: #333; border: 1px solid #555; border-bottom: none; color: #aaa; font-size: 12px; cursor: pointer; z-index: 11; border-radius: 6px 6px 0 0; }
#input-area { position: fixed; bottom: 0; left: 0; width: 140px; top: 36px; padding: 8px 8px 40px; background: rgba(26,26,26,0.9); border-right: 2px solid #333; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
#lamps-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#lamps-top { display: flex; flex-direction: column; gap: 4px; align-items: center; }
#lamps-mid { display: flex; flex-direction: column; gap: 4px; align-items: center; border: 2px solid #555; border-radius: 10px; padding: 4px; }
#lamps-bot { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.lamp { width: 44px; height: 44px; border-radius: 50%; background: #222; border: 2px solid #444; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #555; user-select: none; }
.lamp.on { background: #e0193a; border-color: #ff4060; color: #fff; font-weight: bold; }
#pat-display { font-size: 11px; color: #777; text-align: center; padding: 2px 0; }
#round-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 100%; margin-bottom: 4px; }
.rbtn { height: 38px; border-radius: 6px; border: 2px solid #444; background: #222; color: #aaa; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; }
.rbtn.selected { border-color: #f08; background: #3a1020; color: #fff; }
#recorder-input { width: 100%; padding: 6px 8px; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; font-size: 16px; margin-bottom: 4px; }
#recorder-input::placeholder { color: #555; }
#record-btn { width: 100%; padding: 8px 0; background: #c01030; color: #fff; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
#record-btn:active { background: #900; }
#unsure-btn { width: 100%; padding: 7px 0; background: #5a4a10; color: #ddb; font-size: 11px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
#unsure-btn:active { background: #3a3008; }
#reset-btn { width: 100%; padding: 6px 0; background: #333; color: #aaa; font-size: 11px; border: none; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<div id="tabs">
  <div class="tab active" data-mode="n1a">通常1a</div>
  <div class="tab" data-mode="n1b">通常1b</div>
  <div class="tab" data-mode="r2a">ラッシュ2a</div>
  <div class="tab" data-mode="r2b">ラッシュ2b</div>
  <div class="tab" data-mode="r2c">ラッシュ2c</div>
</div>
<div id="list-area">
  <div id="sort-btns">
    <div class="sbtn active" data-sort="new">新着順</div>
    <div class="sbtn" data-sort="pattern">パターン順</div>
    <div class="sbtn" data-sort="count">個数順</div>
    <div class="sbtn" data-sort="result">結果別</div>
    <div class="sbtn" data-sort="recorder">人別</div>
  </div>
  <div id="sort-label">新着順</div>
  <div id="list"></div>
</div>
<div id="copy-msg"></div>
<div id="bottom-btns">
  <button id="copy-btn">データ表示</button>
  <button id="clear-btn">データ削除</button>
</div>
<div id="copy-area" style="display:none;padding:8px 12px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
    <span style="font-size:13px;color:#aaa;">全選択してコピーしてください</span>
    <button id="close-copy-btn" style="padding:4px 10px;background:#333;color:#aaa;border:1px solid #555;border-radius:6px;font-size:13px;cursor:pointer;">閉じる</button>
  </div>
  <textarea id="copy-textarea" style="width:100%;height:200px;background:#1a1a2e;color:#ccc;font-size:12px;border:1px solid #333;border-radius:6px;padding:8px;font-family:monospace;" readonly></textarea>
  <button id="select-all-btn" style="display:block;width:100%;padding:10px;background:#2a4a2a;color:#aca;font-size:14px;border:none;border-radius:8px;cursor:pointer;margin-top:6px;">全選択</button>
</div>

<button id="toggle-btn">入力を隠す</button>
<div id="input-area">
  <div id="lamps-col">
    <div id="lamps-top"></div>
    <div id="lamps-mid"></div>
    <div id="lamps-bot"></div>
    <div id="pat-display">0個/なし</div>
    <div id="round-btns"></div>
    <input id="recorder-input" type="text" placeholder="記入者名" maxlength="20">
    <button id="record-btn">記録する</button>
    <button id="unsure-btn">自信なし</button>
    <button id="reset-btn">リセット</button>
  </div>
</div>

<script>
var ON_NUMS = ['❶','❷','❸','❹','❺','❻','❼','❽'];
var OFF_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧'];
var NUM_LAMPS = 8;
var STORAGE_KEY = 'seg_v5';
var MODES = {
  n1a:  { label: '通常1a',    rounds: ['E','G','A','V','VV'] },
  n1b:  { label: '通常1b',    rounds: ['E','G','A','V','VV'] },
  r2a:  { label: 'ラッシュ2a', rounds: ['継続','転落'] },
  r2b:  { label: 'ラッシュ2b', rounds: ['継続','転落'] },
  r2c:  { label: 'ラッシュ2c', rounds: ['保留V','保留VV'] }
};
var mode = 'n1a';
var lamps = [0,0,0,0,0,0,0,0];
var selectedRound = null;
var sortType = 'new';
var allData = {};

function initData() {
  var keys = Object.keys(MODES);
  for (var i = 0; i < keys.length; i++) {
    if (!allData[keys[i]]) { allData[keys[i]] = []; }
  }
}
function loadData() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) { allData = JSON.parse(s); }
  } catch(e) { allData = {}; }
  initData();
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); } catch(e) {}
}
function getRounds() { return MODES[mode].rounds; }
function getRawPattern() { return lamps.join(''); }
function patternToNum(pat) { return parseInt(pat, 2); }
function countOn(pat) {
  var n = 0;
  for (var i = 0; i < pat.length; i++) { if (pat[i] === '1') { n++; } }
  return n;
}
function getLitNums() {
  var lit = [];
  for (var i = 0; i < NUM_LAMPS; i++) { if (lamps[i]) { lit.push(i + 1); } }
  return lit;
}

function renderLamps() {
  var top = document.getElementById('lamps-top');
  var mid = document.getElementById('lamps-mid');
  var bot = document.getElementById('lamps-bot');
  top.innerHTML = ''; mid.innerHTML = ''; bot.innerHTML = '';
  for (var i = NUM_LAMPS - 1; i >= 0; i--) {
    var el = document.createElement('div');
    el.className = 'lamp' + (lamps[i] ? ' on' : '');
    el.setAttribute('data-idx', i);
    el.textContent = lamps[i] ? ON_NUMS[i] : OFF_NUMS[i];
    if (i === 7) { top.appendChild(el); }
    else if (i >= 3) { mid.appendChild(el); }
    else { bot.appendChild(el); }
  }
  var lit = getLitNums();
  var cnt = lit.length;
  document.getElementById('pat-display').textContent = cnt + '個/' + (cnt === 0 ? 'なし' : lit.join(''));
}

function renderRoundBtns() {
  var rounds = getRounds();
  var c = document.getElementById('round-btns');
  c.innerHTML = '';
  for (var i = 0; i < rounds.length; i++) {
    var el = document.createElement('button');
    el.className = 'rbtn' + (selectedRound === rounds[i] ? ' selected' : '');
    el.setAttribute('data-round', rounds[i]);
    el.textContent = rounds[i];
    c.appendChild(el);
  }
}

function renderList() {
  var src = allData[mode];
  var rounds = getRounds();
  // インデックス付きコピー
  var arr = [];
  for (var k = 0; k < src.length; k++) {
    arr.push({ pat: src[k].pat, round: src[k].round, unsure: src[k].unsure, recorder: src[k].recorder, idx: k });
  }
  if (sortType === 'new') { arr.reverse(); }
  else if (sortType === 'pattern') {
    arr.sort(function(a, b) { return patternToNum(a.pat) - patternToNum(b.pat); });
  } else if (sortType === 'count') {
    arr.sort(function(a, b) {
      var ca = countOn(a.pat); var cb = countOn(b.pat);
      if (ca !== cb) { return ca - cb; }
      return patternToNum(a.pat) - patternToNum(b.pat);
    });
  } else if (sortType === 'result') {
    arr.sort(function(a, b) {
      var ra = rounds.indexOf(a.round); var rb = rounds.indexOf(b.round);
      if (ra !== rb) { return ra - rb; }
      return patternToNum(a.pat) - patternToNum(b.pat);
    });
  } else if (sortType === 'recorder') {
    arr.sort(function(a, b) {
      var ra = a.recorder || ''; var rb = b.recorder || '';
      if (ra !== rb) { return ra < rb ? -1 : 1; }
      return patternToNum(a.pat) - patternToNum(b.pat);
    });
  }
  var c = document.getElementById('list');
  if (arr.length === 0) {
    c.innerHTML = '<div style="text-align:center;color:#444;padding:20px;font-size:14px;">データなし</div>';
    return;
  }
  var html = '';

  // 新着順は人別ボックス表示
  if (sortType === 'new') {
    // 人ごとにグループ化（登場順）
    var recorderOrder = [];
    var recorderMap = {};
    for (var i = 0; i < arr.length; i++) {
      var rec = arr[i].recorder || '（名前なし）';
      if (!recorderMap[rec]) { recorderMap[rec] = []; recorderOrder.push(rec); }
      recorderMap[rec].push(arr[i]);
    }
    for (var r = 0; r < recorderOrder.length; r++) {
      var name = recorderOrder[r];
      var rows = recorderMap[name];
      html += '<div class="recorder-box">';
      html += '<div class="recorder-box-title">' + name + '</div>';
      for (var i = 0; i < rows.length; i++) {
        var d = rows[i];
        html += '<div class="list-row' + (d.unsure ? ' unsure' : '') + '"><div class="row-lamps">';
        for (var j = 0; j < NUM_LAMPS; j++) {
          var on = d.pat[j] === '1';
          html += '<div class="rl ' + (on ? 'on' : 'off') + '">' + (on ? ON_NUMS[j] : OFF_NUMS[j]) + '</div>';
        }
        html += '</div><div class="row-right"><div class="row-result' + (d.round === '転落' ? ' tenraku' : '') + '">' + d.round + '</div>';
        if (d.unsure) { html += '<div class="row-unsure">自信なし</div>'; }
        html += '</div><button class="del-btn" data-idx="' + d.idx + '">削</button></div>';
      }
      html += '</div>';
    }
    c.innerHTML = html;
    return;
  }

  var lastRound = null; var lastCount = -1; var lastRecorder = null;
  for (var i = 0; i < arr.length; i++) {
    var d = arr[i];
    if (sortType === 'result' && d.round !== lastRound) {
      html += '<div class="group-label">' + d.round + '</div>';
      lastRound = d.round;
    }
    if (sortType === 'count') {
      var cnt = countOn(d.pat);
      if (cnt !== lastCount) {
        html += '<div class="group-label">' + cnt + '個点灯</div>';
        lastCount = cnt;
      }
    }
    if (sortType === 'recorder') {
      var rec = d.recorder || '（名前なし）';
      if (rec !== lastRecorder) {
        html += '<div class="group-label">' + rec + '</div>';
        lastRecorder = rec;
      }
    }
    html += '<div class="list-row' + (d.unsure ? ' unsure' : '') + '"><div class="row-lamps">';
    for (var j = 0; j < NUM_LAMPS; j++) {
      var on = d.pat[j] === '1';
      html += '<div class="rl ' + (on ? 'on' : 'off') + '">' + (on ? ON_NUMS[j] : OFF_NUMS[j]) + '</div>';
    }
    html += '</div><div class="row-right"><div class="row-result' + (d.round === '転落' ? ' tenraku' : '') + '">' + d.round + '</div>';
    if (d.recorder) { html += '<div class="row-recorder">' + d.recorder + '</div>'; }
    if (d.unsure) { html += '<div class="row-unsure">自信なし</div>'; }
    html += '</div><button class="del-btn" data-idx="' + d.idx + '">削</button></div>';
  }
  c.innerHTML = html;
}

function doRecord(unsure) {
  if (!selectedRound) { alert('結果を選択してください'); return; }
  var recorder = document.getElementById('recorder-input').value.trim();
  if (recorder) { localStorage.setItem('seg_recorder', recorder); }
  allData[mode].push({ pat: getRawPattern(), round: selectedRound, unsure: unsure ? true : false, recorder: recorder });
  saveData();
  lamps = [0,0,0,0,0,0,0,0];
  selectedRound = null;
  renderLamps(); renderRoundBtns(); renderList();
}

document.getElementById('tabs').addEventListener('click', function(e) {
  var el = e.target;
  if (!el.classList.contains('tab')) { return; }
  mode = el.getAttribute('data-mode');
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].className = 'tab' + (tabs[i].getAttribute('data-mode') === mode ? ' active' : '');
  }
  selectedRound = null;
  lamps = [0,0,0,0,0,0,0,0];
  renderLamps(); renderRoundBtns(); renderList();
});

document.getElementById('lamps-col').addEventListener('click', function(e) {
  var el = e.target;
  if (!el.classList.contains('lamp')) { return; }
  var idx = parseInt(el.getAttribute('data-idx'));
  lamps[idx] = lamps[idx] ? 0 : 1;
  renderLamps();
});

document.getElementById('round-btns').addEventListener('click', function(e) {
  var el = e.target;
  if (!el.classList.contains('rbtn')) { return; }
  selectedRound = el.getAttribute('data-round');
  renderRoundBtns();
});

document.getElementById('record-btn').addEventListener('click', function() { doRecord(false); });
document.getElementById('unsure-btn').addEventListener('click', function() { doRecord(true); });
document.getElementById('reset-btn').addEventListener('click', function() {
  lamps = [0,0,0,0,0,0,0,0]; renderLamps();
});

document.getElementById('list').addEventListener('click', function(e) {
  var el = e.target;
  if (!el.classList.contains('del-btn')) { return; }
  var idx = parseInt(el.getAttribute('data-idx'));
  allData[mode].splice(idx, 1);
  saveData();
  renderList();
});

document.getElementById('sort-btns').addEventListener('click', function(e) {
  var el = e.target;
  if (!el.classList.contains('sbtn')) { return; }
  sortType = el.getAttribute('data-sort');
  var sbtns = document.querySelectorAll('.sbtn');
  for (var i = 0; i < sbtns.length; i++) {
    sbtns[i].className = 'sbtn' + (sbtns[i].getAttribute('data-sort') === sortType ? ' active' : '');
  }
  var labelMap = { 'new': '新着順', 'pattern': 'パターン順', 'count': '個数順', 'result': '結果別', 'recorder': '人別' };
  document.getElementById('sort-label').textContent = labelMap[sortType];
  renderList();
});

document.getElementById('copy-btn').addEventListener('click', function() {
  var lines = ['パターン\t結果\t自信なし\t記入者'];
  var src = allData[mode];
  var arr = [];
  for (var k = 0; k < src.length; k++) {
    arr.push({ pat: src[k].pat, round: src[k].round, unsure: src[k].unsure, recorder: src[k].recorder, idx: k });
  }
  var rounds = getRounds();
  if (sortType === 'new') { arr.reverse(); }
  else if (sortType === 'pattern') { arr.sort(function(a, b) { return patternToNum(a.pat) - patternToNum(b.pat); }); }
  else if (sortType === 'count') { arr.sort(function(a, b) { var ca = countOn(a.pat); var cb = countOn(b.pat); if (ca !== cb) { return ca - cb; } return patternToNum(a.pat) - patternToNum(b.pat); }); }
  else if (sortType === 'result') { arr.sort(function(a, b) { var ra = rounds.indexOf(a.round); var rb = rounds.indexOf(b.round); if (ra !== rb) { return ra - rb; } return patternToNum(a.pat) - patternToNum(b.pat); }); }
  else if (sortType === 'recorder') { arr.sort(function(a, b) { var ra = a.recorder || ''; var rb = b.recorder || ''; if (ra !== rb) { return ra < rb ? -1 : 1; } return patternToNum(a.pat) - patternToNum(b.pat); }); }
  for (var i = 0; i < arr.length; i++) {
    var d = arr[i]; var disp = '';
    for (var j = 0; j < NUM_LAMPS; j++) {
      disp += d.pat[j] === '1' ? ON_NUMS[j] : OFF_NUMS[j];
    }
    lines.push(disp + '\t' + d.round + '\t' + (d.unsure ? '自信なし' : '') + '\t' + (d.recorder || ''));
  }
  var text = lines.join('\n');
  var ta = document.getElementById('copy-textarea');
  ta.value = text;
  document.getElementById('copy-area').style.display = 'block';
  ta.select();
});

document.getElementById('select-all-btn').addEventListener('click', function() {
  var ta = document.getElementById('copy-textarea');
  ta.select();
});

document.getElementById('close-copy-btn').addEventListener('click', function() {
  document.getElementById('copy-area').style.display = 'none';
});

document.getElementById('clear-btn').addEventListener('click', function() {
  if (confirm(MODES[mode].label + 'のデータを全削除しますか？')) {
    allData[mode] = []; saveData(); renderList();
  }
});

var panelOpen = true;
document.getElementById('toggle-btn').addEventListener('click', function() {
  panelOpen = !panelOpen;
  var panel = document.getElementById('input-area');
  var btn = document.getElementById('toggle-btn');
  if (panelOpen) {
    panel.style.display = 'block';
    document.body.style.paddingLeft = '148px';
    btn.textContent = '入力を隠す';
    btn.style.width = '140px';
  } else {
    panel.style.display = 'none';
    document.body.style.paddingLeft = '0';
    btn.textContent = '入力を表示';
    btn.style.width = '80px';
  }
});

loadData(); renderLamps(); renderRoundBtns(); renderList();
var savedRecorder = localStorage.getItem('seg_recorder');
if (savedRecorder) { document.getElementById('recorder-input').value = savedRecorder; }
</script>
</body>
</html>
