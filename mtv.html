<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MTV カウンター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{background:#0a1628;color:#e8f0ff;font-family:'Helvetica Neue',sans-serif;min-height:100vh;padding:12px;}
h1{text-align:center;font-size:18px;letter-spacing:2px;color:#4af;padding:10px 0 16px;border-bottom:1px solid #1e3a5f;}
.section{background:#0f2040;border:1px solid #1e3a5f;border-radius:10px;margin:12px 0;padding:12px;}
.section-title{font-size:12px;color:#4af;letter-spacing:1px;margin-bottom:10px;font-weight:bold;}
.counter-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #152a4a;}
.counter-row:last-child{border-bottom:none;}
.label{font-size:13px;color:#aac;flex:1;line-height:1.3;text-align:right;padding-right:12px;}
.ctrl{display:flex;align-items:center;gap:8px;}
.btn{width:44px;height:44px;border:none;border-radius:8px;font-size:20px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-minus{background:#1e3a5f;color:#4af;}
.btn-plus{background:#1464a0;color:#fff;}
.val{width:52px;text-align:center;font-size:20px;font-weight:bold;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#152a4a;border-radius:6px;padding:4px 0;}
.result-box{background:#0a1628;border:1px solid #1e3a5f;border-radius:8px;padding:10px;margin-top:8px;}
.res-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#cde;}
.res-label{color:#aac;}
.res-val{font-weight:bold;color:#4af;}
.reset-btn{display:block;width:100%;margin-top:16px;padding:12px;background:#1e3a5f;border:1px solid #2a5080;border-radius:10px;color:#4af;font-size:16px;letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.game-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.game-row:last-of-type{margin-bottom:0;}
.glabel{font-size:13px;color:#aac;width:56px;}
.gdisp{background:#152a4a;border:1px solid #1e3a5f;border-radius:6px;color:#fff;font-size:20px;min-width:110px;padding:6px 10px;text-align:right;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:1px;}
#kbOverlay{display:none;position:fixed;left:0;right:0;bottom:0;top:0;z-index:100;background:rgba(0,0,0,0.5);}
#kbOverlay.show{display:block;}
#kbBox{position:absolute;left:0;right:0;bottom:0;background:#0f2040;border-top:2px solid #1e3a5f;padding:10px 8px 24px;}
#kbTitle{font-size:12px;color:#4af;text-align:center;margin-bottom:6px;letter-spacing:1px;}
#kbVal{font-size:28px;font-weight:bold;color:#fff;text-align:right;background:#152a4a;border-radius:8px;padding:6px 14px;margin-bottom:8px;min-height:46px;letter-spacing:2px;}
#kbGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.kbtn{height:54px;border:none;border-radius:10px;font-size:22px;font-weight:bold;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#1a3a60;color:#fff;}
.kbtn:active{background:#2a5a90;}
.kbtn-del{background:#1e3a5f;color:#f88;font-size:18px;}
.kbtn-ok{background:#1464a0;color:#fff;font-size:16px;letter-spacing:1px;}
.kbtn-clr{background:#1e2a40;color:#aac;font-size:16px;}
</style>
</head>
<body>
<h1>🐎 MTV カウンター</h1>

<div class="section">
  <div class="section-title">ゲーム数</div>
  <div class="game-row">
    <span class="glabel">開始G</span>
    <div class="gdisp" id="dStart" onclick="openKb('gStart','開始ゲーム数')">0</div>
  </div>
  <div class="game-row">
    <span class="glabel">現在G</span>
    <div class="gdisp" id="dNow" onclick="openKb('gNow','現在ゲーム数')">0</div>
  </div>
  <div class="result-box">
    <div class="res-row"><span class="res-label">消化G数</span><span class="res-val" id="rG">0 G</span></div>
  </div>
</div>

<div class="section">
  <div class="section-title">5枚役</div>
  <div class="counter-row">
    <div class="ctrl">
      <button class="btn btn-plus" onclick="adj('c5',1)">＋</button>
      <span class="val" id="v_c5" onclick="openKb('c5','5枚役 合算')">0</span>
      <button class="btn btn-minus" onclick="adj('c5',-1)">－</button>
    </div>
    <span class="label">5枚役 合算</span>
  </div>
  <div class="result-box">
    <div class="res-row"><span class="res-label">出現率</span><span class="res-val" id="r5">－</span></div>
  </div>
</div>

<div class="section">
  <div class="section-title">激走チャージ終了 サブ液晶</div>
  <div class="counter-row">
    <div class="ctrl">
      <button class="btn btn-plus" onclick="adj('cK',1)">＋</button>
      <span class="val" id="v_cK" onclick="openKb('cK','憲二・・・')">0</span>
      <button class="btn btn-minus" onclick="adj('cK',-1)">－</button>
    </div>
    <span class="label">落ち着くんだ<br>憲二・・・</span>
  </div>
  <div class="counter-row">
    <div class="ctrl">
      <button class="btn btn-plus" onclick="adj('cK2',1)">＋</button>
      <span class="val" id="v_cK2" onclick="openKb('cK2','この気配は')">0</span>
      <button class="btn btn-minus" onclick="adj('cK2',-1)">－</button>
    </div>
    <span class="label">この気配は</span>
  </div>
  <div class="result-box">
    <div class="res-row"><span class="res-label">合計回数</span><span class="res-val" id="rSub">0 回</span></div>
    <div class="res-row"><span class="res-label">憲二 比率</span><span class="res-val" id="rK">－</span></div>
    <div class="res-row"><span class="res-label">気配 比率</span><span class="res-val" id="rK2">－</span></div>
  </div>
</div>

<button class="reset-btn" onclick="resetAll()">リセット</button>

<div id="kbOverlay" onclick="closeKb(event)">
  <div id="kbBox">
    <div id="kbTitle"></div>
    <div id="kbVal">0</div>
    <div id="kbGrid">
      <button class="kbtn" onclick="kInput('7')">7</button>
      <button class="kbtn" onclick="kInput('8')">8</button>
      <button class="kbtn" onclick="kInput('9')">9</button>
      <button class="kbtn" onclick="kInput('4')">4</button>
      <button class="kbtn" onclick="kInput('5')">5</button>
      <button class="kbtn" onclick="kInput('6')">6</button>
      <button class="kbtn" onclick="kInput('1')">1</button>
      <button class="kbtn" onclick="kInput('2')">2</button>
      <button class="kbtn" onclick="kInput('3')">3</button>
      <button class="kbtn kbtn-clr" onclick="kClear()">C</button>
      <button class="kbtn" onclick="kInput('0')">0</button>
      <button class="kbtn kbtn-del" onclick="kDel()">⌫</button>
      <button class="kbtn kbtn-ok" style="grid-column:1/4;" onclick="kOk()">確定</button>
    </div>
  </div>
</div>

<script>
var SAVE_KEY = 'mtv_counter_v1';
var counts = {c5:0, cK:0, cK2:0};
var gVals = {gStart:0, gNow:0};
var kbTarget = '';
var kbStr = '';
var kbDispMap = {gStart:'dStart',gNow:'dNow',c5:'v_c5',cK:'v_cK',cK2:'v_cK2'};

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({counts:counts, gVals:gVals}));
  } catch(e) {}
}

function load() {
  try {
    var d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return;
    if (d.counts) counts = d.counts;
    if (d.gVals) gVals = d.gVals;
    document.getElementById('v_c5').textContent = counts.c5;
    document.getElementById('v_cK').textContent = counts.cK;
    document.getElementById('v_cK2').textContent = counts.cK2;
    document.getElementById('dStart').textContent = gVals.gStart;
    document.getElementById('dNow').textContent = gVals.gNow;
  } catch(e) {}
}

function getCurrentVal(id) {
  if (id === 'gStart' || id === 'gNow') return gVals[id];
  return counts[id];
}

function openKb(id, title) {
  kbTarget = id;
  kbStr = String(getCurrentVal(id));
  document.getElementById('kbTitle').textContent = title;
  document.getElementById('kbVal').textContent = kbStr;
  document.getElementById('kbOverlay').className = 'show';
}

function closeKb(e) {
  if (e.target === document.getElementById('kbOverlay')) {
    document.getElementById('kbOverlay').className = '';
  }
}

function kInput(d) {
  if (kbStr === '0') kbStr = d;
  else kbStr += d;
  if (kbStr.length > 6) kbStr = kbStr.slice(0, 6);
  document.getElementById('kbVal').textContent = kbStr;
}

function kDel() {
  kbStr = kbStr.slice(0, -1);
  if (kbStr === '') kbStr = '0';
  document.getElementById('kbVal').textContent = kbStr;
}

function kClear() {
  kbStr = '0';
  document.getElementById('kbVal').textContent = kbStr;
}

function kOk() {
  var n = parseInt(kbStr) || 0;
  if (kbTarget === 'gStart' || kbTarget === 'gNow') {
    gVals[kbTarget] = n;
  } else {
    counts[kbTarget] = Math.max(0, n);
  }
  document.getElementById(kbDispMap[kbTarget]).textContent = n;
  document.getElementById('kbOverlay').className = '';
  calc();
  save();
}

function adj(key, d) {
  counts[key] = Math.max(0, counts[key] + d);
  document.getElementById('v_' + key).textContent = counts[key];
  calc();
  save();
}

function calc() {
  var g = Math.max(0, gVals.gNow - gVals.gStart);
  document.getElementById('rG').textContent = g + ' G';
  if (g > 0 && counts.c5 > 0) {
    document.getElementById('r5').textContent = '1 / ' + (g / counts.c5).toFixed(2);
  } else {
    document.getElementById('r5').textContent = '－';
  }
  var total = counts.cK + counts.cK2;
  document.getElementById('rSub').textContent = total + ' 回';
  if (total > 0) {
    document.getElementById('rK').textContent = (counts.cK / total * 100).toFixed(1) + '% (' + counts.cK + '/' + total + ')';
    document.getElementById('rK2').textContent = (counts.cK2 / total * 100).toFixed(1) + '% (' + counts.cK2 + '/' + total + ')';
  } else {
    document.getElementById('rK').textContent = '－';
    document.getElementById('rK2').textContent = '－';
  }
}

function resetAll() {
  if (!confirm('リセットしますか？')) return;
  counts = {c5:0, cK:0, cK2:0};
  gVals = {gStart:0, gNow:0};
  document.getElementById('v_c5').textContent = '0';
  document.getElementById('v_cK').textContent = '0';
  document.getElementById('v_cK2').textContent = '0';
  document.getElementById('dStart').textContent = '0';
  document.getElementById('dNow').textContent = '0';
  calc();
  save();
}

load();
calc();
</script>
</body>
</html>
