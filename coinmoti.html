<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>稼働メモ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#fff;color:#000;font-family:-apple-system,sans-serif;font-size:12px;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#toolbar{background:#1a1a1a;padding:5px 8px;display:flex;gap:4px;flex-shrink:0}
.tbtn{flex:1;padding:7px 2px;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer}
.tbtn:active{opacity:.7}
.tb-blue{background:#0a2a6a;color:#fff}
.tb-gold{background:#b8940a;color:#000}
.tb-gray{background:#333;color:#fff}
.tb-red{background:#6a1010;color:#fff}
#sheet{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overflow-x:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td,th{border:1px solid #bbb;padding:3px 2px;font-size:11px;text-align:center;overflow:hidden;white-space:nowrap}
.hdr{background:#dae3f3;font-weight:bold;color:#222;font-size:10px;padding:3px 2px}
.lbl{background:#f2f2f2;color:#444;text-align:left;font-size:10px;padding-left:4px}
.calc{background:#fff;color:#000;text-align:right}
.gcell{background:#e2efda;text-align:right}
.ycell{background:#ffff99;cursor:pointer;color:#000;text-align:right;font-size:20px;font-weight:bold;height:36px}
.ycell.active{outline:3px solid #1155cc;background:#ffffcc}
.coin{background:#fff2cc;font-weight:bold;font-size:14px;text-align:right}
.rowidx{background:#f2f2f2;color:#888;font-size:10px;width:14px}
.btype-td{background:#ffff99;text-align:center;width:54px}
.bspan{display:inline-block;padding:1px 4px;border-radius:3px;font-size:10px;cursor:pointer;color:#fff;margin:1px}
.role-td{background:#ffff99;cursor:pointer;font-size:11px;color:#336;text-align:center}
.del-td{width:14px;padding:0}
.del{background:none;border:none;color:#c00;font-size:11px;cursor:pointer;width:100%;padding:0}
.addrow{background:#e2efda;cursor:pointer;text-align:center;color:#0a5a0a;font-weight:bold;font-size:15px;padding:8px}
.sep{background:#dae3f3;height:2px;padding:0}
.msg{position:fixed;top:44px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;z-index:500;display:none;white-space:nowrap}
/* 重複役ポップアップ */
#role-popup{position:fixed;background:#fff;border:2px solid #336;border-radius:10px;padding:10px;z-index:400;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
#role-popup .rp-title{font-size:11px;color:#888;margin-bottom:8px;text-align:center}
#role-popup .rp-btn{display:inline-block;padding:8px 14px;margin:3px;border-radius:6px;background:#eee;font-size:13px;cursor:pointer;border:2px solid transparent}
#role-popup .rp-btn.on{background:#336;color:#fff;border-color:#336}
#role-popup .rp-close{display:block;margin-top:8px;padding:7px;background:#c00;color:#fff;border:none;border-radius:6px;width:100%;font-size:13px;cursor:pointer}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:300;display:none}
#numpad{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;border-top:2px solid #444;padding:7px;z-index:200;display:none}
.nrow{display:flex;gap:5px;margin-bottom:5px}
.nk{flex:1;padding:13px 0;background:#2a2a2a;border:none;border-radius:7px;font-size:20px;font-weight:bold;color:#fff;cursor:pointer}
.nk:active{background:#3a3a3a}
.nkc{background:#5a1010}.nkd{background:#102050}.nkok{background:#0a5a0a;font-size:13px}
.np-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;display:none}
</style>
</head>
<body>
<div id="toolbar">
  <div class="tbtn tb-blue" onclick="doCopy()">📋 コピー</div>
  <div class="tbtn tb-gold" onclick="saveRecord()">💾 保存</div>
  <div class="tbtn tb-gray" onclick="showRecs()">📂 記録</div>
  <div class="tbtn tb-red" onclick="doReset()">🗑 リセット</div>
</div>
<div id="sheet"><table id="tbl"></table></div>
<div class="msg" id="msg"></div>

<!-- 重複役ポップアップ -->
<div class="overlay" id="role-ov" onclick="closeRolePop()"></div>
<div id="role-popup">
  <div class="rp-title">重複役を選択</div>
  <div id="rp-btns"></div>
  <button class="rp-close" onclick="closeRolePop()">閉じる</button>
</div>

<div class="np-overlay" id="np-ov" onclick="closeNumpad()"></div>
<div id="numpad">
  <div class="nrow">
    <button class="nk" onclick="nk(7)">7</button>
    <button class="nk" onclick="nk(8)">8</button>
    <button class="nk" onclick="nk(9)">9</button>
  </div>
  <div class="nrow">
    <button class="nk" onclick="nk(4)">4</button>
    <button class="nk" onclick="nk(5)">5</button>
    <button class="nk" onclick="nk(6)">6</button>
  </div>
  <div class="nrow">
    <button class="nk" onclick="nk(1)">1</button>
    <button class="nk" onclick="nk(2)">2</button>
    <button class="nk" onclick="nk(3)">3</button>
  </div>
  <div class="nrow">
    <button class="nk nkc" onclick="nk('C')">C</button>
    <button class="nk" onclick="nk(0)">0</button>
    <button class="nk nkd" onclick="nk('DEL')">←</button>
  </div>
  <div class="nrow">
    <button class="nk nkok" style="flex:3" onclick="closeNumpad()">完了</button>
  </div>
</div>

<script>
var cashRate=46;
var rp=0,cash=0,cre=0,sand=0,curG=0;
var hits=[];
var bonusTypes=[{name:'RB',color:'#444'},{name:'BB',color:'#cc0000'}];
var roleTypes=['チェリー','スイカ','単独','リプレイ','不明'];
var curFocus=null,curBuf='';
var roleTarget=-1;
var mt2=null;

function sm(t){
  var el=document.getElementById('msg');
  el.textContent=t;el.style.display='block';
  if(mt2){clearTimeout(mt2);}
  mt2=setTimeout(function(){el.style.display='none';},2500);
}

function calc(){
  var totalG=curG,totalPayout=0;
  var bCounts=[];
  for(var b=0;b<bonusTypes.length;b++){bCounts.push(0);}
  for(var i=0;i<hits.length;i++){
    totalG+=hits[i].g||0;
    totalPayout+=hits[i].payout||0;
    var bt=hits[i].btype||0;
    if(bt<bCounts.length){bCounts[bt]++;}
  }
  var invest=rp+Math.round(cash*cashRate);
  var used=totalPayout+invest-cre-sand;
  var coin=used>0&&totalG>0?totalG/(used/50):0;
  var kval=used>0?(used/50).toFixed(1):0;
  var allProb=hits.length>0?Math.round(totalG/hits.length):0;
  var bProbs=[];
  for(var b2=0;b2<bonusTypes.length;b2++){
    bProbs.push(bCounts[b2]>0?Math.round(totalG/bCounts[b2]):0);
  }
  return{totalG:totalG,totalPayout:totalPayout,invest:invest,used:used,coin:coin,kval:kval,
    allProb:allProb,bProbs:bProbs,bCounts:bCounts,total:hits.length};
}

function render(){
  var s=calc();
  var coinCol=s.coin>=34?'#cc0000':s.coin>=28?'#cc6600':'#000088';
  var h='';

  h+='<tr><td class="hdr" colspan="2">コイン持ち</td><td class="hdr">k換算</td><td class="hdr">使用枚数</td><td class="hdr" colspan="2">総G数</td></tr>';
  h+='<tr>';
  h+='<td class="coin" colspan="2" style="color:'+coinCol+'">'+(s.coin>0?s.coin.toFixed(2):'--')+'G/k</td>';
  h+='<td class="calc">'+(s.kval>0?s.kval:'--')+'k</td>';
  h+='<td class="calc">'+(s.used>0?s.used:'--')+'枚</td>';
  h+='<td class="gcell" colspan="2" style="font-weight:bold">'+s.totalG+'G</td>';
  h+='</tr>';
  h+='<tr><td class="lbl">合成確率</td><td class="gcell">'+(s.allProb>0?'1/'+s.allProb:'--')+'('+s.total+')</td>';
  for(var b=0;b<Math.min(bonusTypes.length,2);b++){
    h+='<td class="lbl">'+bonusTypes[b].name+'</td><td class="gcell">'+(s.bProbs[b]>0?'1/'+s.bProbs[b]:'--')+'('+s.bCounts[b]+')</td>';
  }
  h+='</tr>';

  h+='<tr><td class="sep" colspan="6"></td></tr>';
  h+='<tr><td class="lbl">再プレイ(枚)</td><td class="ycell'+(curFocus==='rp'?' active':'')+'" colspan="2" onclick="focusVal(\'rp\')">'+rp+'</td>';
  h+='<td class="lbl">クレジット</td><td class="ycell'+(curFocus==='cre'?' active':'')+'" colspan="2" onclick="focusVal(\'cre\')">'+cre+'</td></tr>';
  h+='<tr><td class="lbl">お金(k)</td><td class="ycell'+(curFocus==='cash'?' active':'')+'" colspan="2" onclick="focusVal(\'cash\')">'+cash+'</td>';
  h+='<td class="lbl">サンド(枚)</td><td class="ycell'+(curFocus==='sand'?' active':'')+'" colspan="2" onclick="focusVal(\'sand\')">'+sand+'</td></tr>';
  h+='<tr><td class="lbl">換算</td>';
  h+='<td style="background:#f2f2f2;text-align:center" colspan="2">';
  h+='<span onclick="setRate(46)" style="cursor:pointer;padding:2px 5px;background:'+(cashRate===46?'#1155cc':'#ddd')+';color:'+(cashRate===46?'#fff':'#000')+';border-radius:3px;font-size:10px;margin-right:2px">46</span>';
  h+='<span onclick="setRate(50)" style="cursor:pointer;padding:2px 5px;background:'+(cashRate===50?'#1155cc':'#ddd')+';color:'+(cashRate===50?'#fff':'#000')+';border-radius:3px;font-size:10px">50</span>';
  h+='</td><td class="calc" colspan="3">→'+Math.round(cash*cashRate)+'枚</td></tr>';

  h+='<tr><td class="sep" colspan="6"></td></tr>';
  h+='<tr><td class="lbl" colspan="3">現在G数（未当選）</td>';
  h+='<td class="ycell'+(curFocus==='curG'?' active':'')+'" colspan="3" onclick="focusVal(\'curG\')">'+curG+'</td></tr>';

  h+='<tr><td class="sep" colspan="6"></td></tr>';
  h+='<tr>';
  h+='<td style="background:#dae3f3;font-weight:bold;font-size:10px;width:14px;max-width:14px;border:1px solid #bbb;text-align:center;padding:3px 0">回</td>';
  h+='<td class="hdr">G数</td>';
  h+='<td class="hdr" style="width:54px">種別</td>';
  h+='<td class="hdr" style="width:60px">重複役</td>';
  h+='<td class="hdr">獲得(枚)</td>';
  h+='<td style="background:#dae3f3;font-weight:bold;font-size:10px;width:14px;max-width:14px;border:1px solid #bbb;padding:3px 0"></td>';
  h+='</tr>';

  for(var i=0;i<hits.length;i++){
    var hit=hits[i];
    var fkeyG='row_'+i+'_g';
    var fkeyP='row_'+i+'_payout';
    var btns='';
    for(var b3=0;b3<bonusTypes.length;b3++){
      var on=hit.btype===b3?'1':'0.3';
      btns+='<span class="bspan" style="background:'+bonusTypes[b3].color+';opacity:'+on+'" onclick="setBtype('+i+','+b3+')">'+bonusTypes[b3].name+'</span>';
    }
    var roleLbl=hit.role>=0&&roleTypes[hit.role]?roleTypes[hit.role]:'---';
    var roleCol=hit.role>=0?'#336':'#aaa';
    h+='<tr>';
    h+='<td style="background:#f2f2f2;color:#888;font-size:10px;width:14px;max-width:14px;text-align:center;border:1px solid #bbb;padding:2px 0">'+(i+1)+'</td>';
    h+='<td class="ycell'+(curFocus===fkeyG?' active':'')+'" onclick="focusRow('+i+',\'g\')">'+(hit.g||0)+'</td>';
    h+='<td class="btype-td">'+btns+'</td>';
    h+='<td class="role-td" style="color:'+roleCol+'" onclick="openRolePop('+i+')">'+roleLbl+'</td>';
    h+='<td class="ycell'+(curFocus===fkeyP?' active':'')+'" onclick="focusRow('+i+',\'payout\')">'+(hit.payout||0)+'</td>';
    h+='<td style="width:14px;max-width:14px;padding:0;text-align:center;border:1px solid #bbb"><button style="background:none;border:none;color:#c00;font-size:11px;cursor:pointer;padding:0;width:100%" onclick="delRow('+i+')">✕</button></td>';
    h+='</tr>';
  }
  h+='<tr><td class="addrow" colspan="6" onclick="addRow()">＋ 当たり追加</td></tr>';
  document.getElementById('tbl').innerHTML=h;
}

function openRolePop(idx){
  roleTarget=idx;
  var hit=hits[idx];
  var h='';
  for(var r=0;r<roleTypes.length;r++){
    var on=hit.role===r?' on':'';
    h+='<span class="rp-btn'+on+'" onclick="selectRole('+r+')">'+roleTypes[r]+'</span>';
  }
  h+='<span class="rp-btn'+(hit.role===-1?' on':'')+'" onclick="selectRole(-1)">なし</span>';
  document.getElementById('rp-btns').innerHTML=h;
  document.getElementById('role-popup').style.display='block';
  document.getElementById('role-ov').style.display='block';
}

function selectRole(r){
  if(roleTarget>=0){hits[roleTarget].role=r;}
  closeRolePop();
}

function closeRolePop(){
  document.getElementById('role-popup').style.display='none';
  document.getElementById('role-ov').style.display='none';
  roleTarget=-1;
  render();
}

function focusVal(key){
  curFocus=key;
  var v=key==='rp'?rp:key==='cash'?cash:key==='cre'?cre:key==='sand'?sand:curG;
  curBuf=v===0?'':''+v;
  showNP();
}

function focusRow(idx,field){
  curFocus='row_'+idx+'_'+field;
  var v=hits[idx][field]||0;
  curBuf=v===0?'':''+v;
  showNP();
}

function showNP(){
  document.getElementById('numpad').style.display='block';
  document.getElementById('np-ov').style.display='block';
  render();
}

function nk(k){
  if(k==='C'){curBuf='';}
  else if(k==='DEL'){curBuf=curBuf.slice(0,-1);}
  else{if(curBuf.length<7){curBuf=curBuf+''+k;}}
  var v=curBuf===''?0:parseInt(curBuf,10);
  if(curFocus==='rp'){rp=v;}
  else if(curFocus==='cash'){cash=v;}
  else if(curFocus==='cre'){cre=v;}
  else if(curFocus==='sand'){sand=v;}
  else if(curFocus==='curG'){curG=v;}
  else if(curFocus&&curFocus.indexOf('row_')===0){
    var parts=curFocus.split('_');
    var idx=parseInt(parts[1],10);
    var field=parts[2];
    if(hits[idx]){hits[idx][field]=v;}
  }
  render();
}

function closeNumpad(){
  document.getElementById('numpad').style.display='none';
  document.getElementById('np-ov').style.display='none';
  curFocus=null;render();
}

function setRate(v){cashRate=v;render();}
function addRow(){hits.push({g:0,btype:0,payout:0,role:-1});render();}
function delRow(idx){hits.splice(idx,1);render();}
function setBtype(idx,bt){hits[idx].btype=bt;render();}

function doCopy(){
  var s=calc();
  var lines=['【稼働メモ】'];
  lines.push('コイン持ち: '+(s.coin>0?s.coin.toFixed(2)+'G/k':'--'));
  lines.push('総通常G数: '+s.totalG+'G');
  lines.push('使用枚数: '+s.used+'枚 ('+s.kval+'k)');
  lines.push('合成確率: 1/'+(s.allProb||'--')+' ('+s.total+'回)');
  for(var b=0;b<bonusTypes.length;b++){
    var prob=s.bCounts[b]>0?Math.round(s.totalG/s.bCounts[b]):'--';
    lines.push(bonusTypes[b].name+': 1/'+prob+' ('+s.bCounts[b]+'回)');
  }
  lines.push('---');
  lines.push('回\tG数\t種別\t重複役\t獲得枚数');
  for(var i=0;i<hits.length;i++){
    var h2=hits[i];
    var rn=h2.role>=0&&roleTypes[h2.role]?roleTypes[h2.role]:'';
    lines.push((i+1)+'\t'+(h2.g||0)+'\t'+(bonusTypes[h2.btype]?bonusTypes[h2.btype].name:'')+'\t'+rn+'\t'+(h2.payout||0));
  }
  var text=lines.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){sm('コピーしました！');});
  } else {
    var ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    sm('コピーしました！');
  }
}

function saveRecord(){
  var s=calc();
  var now=new Date();
  var ds=(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+('0'+now.getMinutes()).slice(-2);
  var rec={date:ds,coin:s.coin,totalG:s.totalG,used:s.used,total:s.total,bCounts:s.bCounts,
    hits:JSON.parse(JSON.stringify(hits)),rp:rp,cash:cash,cre:cre,sand:sand,cashRate:cashRate,curG:curG};
  var recs=[];
  try{recs=JSON.parse(localStorage.getItem('slotRecs4')||'[]');}catch(e){}
  recs.unshift(rec);
  if(recs.length>20){recs=recs.slice(0,20);}
  localStorage.setItem('slotRecs4',JSON.stringify(recs));
  sm('保存しました');
}

function showRecs(){
  var recs=[];
  try{recs=JSON.parse(localStorage.getItem('slotRecs4')||'[]');}catch(e){}
  if(recs.length===0){sm('記録がありません');return;}
  var text='【過去記録】\n';
  for(var i=0;i<recs.length;i++){
    var r=recs[i];
    text+=r.date+' | '+(r.coin>0?r.coin.toFixed(1)+'G/k':'--')+' | 総G:'+r.totalG+' | '+r.total+'回\n';
  }
  alert(text);
}

function doReset(){
  rp=0;cash=0;cre=0;sand=0;curG=0;hits=[];
  curFocus=null;curBuf='';
  closeNumpad();render();sm('リセットしました');
}

render();
</script>
</body>
</html>
