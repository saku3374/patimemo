<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>スロット実戦メモ</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;color:#17212b}header{padding:10px;background:#17212b;color:white;display:flex;gap:8px;align-items:center;justify-content:space-between}button,select,input{font:inherit}button{border:1px solid #cbd5e1;border-radius:8px;background:white;padding:10px 3px;touch-action:manipulation}button:active{background:#cbd5e1}.active{background:#d1fae5;border-color:#059669}.tabs{display:flex;gap:4px;padding:7px}.tabs button{flex:1}.panel{background:white;margin:5px 7px;border-radius:10px;padding:10px}.memo{min-height:145px;max-height:28vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.65}.controls{display:grid;grid-template-columns: 35% 32% 33%;gap:4px;padding:5px 7px}.column{min-width:0}.coltitle{text-align:center;font-size:11px;color:#64748b;margin:3px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.keys button{min-height:48px;padding:3px}.tokens{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.tokens button,.states button{min-height:44px;font-size:13px}.states{display:grid;grid-template-columns:1fr 1fr;gap:4px}.gdisplay{background:white;text-align:center;padding:10px 0;font-size:23px;border-radius:8px;margin-bottom:5px}.muted{color:#64748b;font-size:12px}.hidden{display:none}.line{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.line>*{flex:1}.sectiontitle{font-weight:bold;margin-bottom:8px}#detail{font-size:13px}.tiny{font-size:12px}.scroll{max-height:38vh;overflow:auto}textarea{width:100%;min-height:65px}select,input{max-width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:6px}.danger{color:#b91c1c}#toast{font-size:11px}</style></head><body><header><strong>実戦メモ v0.1</strong><select id="machine"><option value="サンブレイク">サンブレイク</option><option value="カバネリ">カバネリ</option><option value="汎用">汎用</option></select><span id="toast">自動保存</span></header><div class="tabs"><button onclick="tab('memo')">メモ</button><button onclick="tab('cz')">CZ/AT</button><button onclick="tab('stats')">集計</button><button onclick="tab('config')">設定</button></div><section class="panel" id="memoPane"><div class="line"><strong id="statusLabel">通常</strong><button onclick="undo()">↶ 1つ戻す</button><button onclick="newSession()">新規実戦</button></div><div class="memo" id="memo"></div></section><section class="panel hidden" id="czPane"><div class="sectiontitle">CZ・AT履歴</div><div class="muted">開始と終了を押すと区間G数を計算します。開始・終了Gは手入力の値です。</div><div id="segments" class="scroll"></div></section><section class="panel hidden" id="statsPane"><div class="sectiontitle">カウンター（成立／結果）</div><div id="stats"></div></section><section class="panel hidden" id="configPane"><div class="sectiontitle">機種別ボタン設定</div><div class="muted">小役・契機ボタン（カンマ区切り）</div><textarea id="tokenConfig"></textarea><div class="muted">状態ボタン（カンマ区切り）</div><input id="stateConfig"><div class="line"><button onclick="saveConfig()">この機種に保存</button><button onclick="exportData()">JSONバックアップ</button><button onclick="document.getElementById('importFile').click()">読み込み</button></div><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)"><div class="line"><button onclick="exportText()">メモをテキスト保存</button><button class="danger" onclick="resetMachine()">機種設定初期化</button></div></section><div class="controls"><div class="column"><div class="coltitle">ゲーム数</div><div id="g" class="gdisplay">0</div><div class="keys" id="keys"><button onclick="keyPress('1')">1</button><button onclick="keyPress('2')">2</button><button onclick="keyPress('3')">3</button><button onclick="keyPress('4')">4</button><button onclick="keyPress('5')">5</button><button onclick="keyPress('6')">6</button><button onclick="keyPress('7')">7</button><button onclick="keyPress('8')">8</button><button onclick="keyPress('9')">9</button><button onclick="keyPress('C')">C</button><button onclick="keyPress('0')">0</button><button onclick="keyPress('⌫')">⌫</button></div><button style="width:100%;margin-top:5px" onclick="clearG()">G数クリア</button></div><div class="column"><div class="coltitle">小役・契機</div><div class="tokens" id="tokens"><button onclick="add('🔴')">🔴</button><button onclick="add('🟢')">🟢</button><button onclick="add('🟣')">🟣</button><button onclick="add('強🍒')">強🍒</button><button onclick="add('強🍉')">強🍉</button><button onclick="add('🐱')">🐱</button><button onclick="add('〇')">〇</button><button onclick="add('×')">×</button></div></div><div class="column"><div class="coltitle">状態・区間</div><div class="states" id="states"><button onclick="setState('通常')">通常</button><button onclick="setState('高確')">高確</button><button onclick="setState('超高確')">超高確</button><button onclick="setState('前兆')">前兆</button><button onclick="setState('不明')">不明</button></div><div class="states" style="margin-top:5px"><button onclick="segment('CZ')">CZ開始/終了</button><button onclick="segment('AT')">AT開始/終了</button><button onclick="add('〇')">〇</button><button onclick="add('×')">×</button><button onclick="add('[')">[</button><button onclick="add(']')">]</button><button onclick="add('↑')">↑</button><button onclick="add('↓')">↓</button></div></div></div><section class="panel"><div class="line"><input id="free" placeholder="自由入力（例：青クエ）"><button onclick="add(document.getElementById('free').value);document.getElementById('free').value=''">追加</button></div><div class="tiny muted">同じG数の入力は横に連結。状態は切替式で、区間内の記録に状態を保持します。試作版のため確定／推定の自動判別はしません。</div></section><script>
const defaults={'サンブレイク':{tokens:['🔴','🟢','🟣','強🍒','強🍉','🐱','BZ','福引','①','②','③','④','⑤','🟦','🟥','🟪'],states:['通常','高確','超高確','不明','前兆']},'カバネリ':{tokens:['弱🍒','強🍒','🍉','チャンス目','発光','CZ','ST','〇','×'],states:['通常','発光中','前兆','不明']},'汎用':{tokens:['弱🍒','強🍒','弱🍉','強🍉','CZ','AT','〇','×'],states:['通常','高確','超高確','不明','前兆']}};
const storage='slotmemo_generic_v01';let db;try{db=JSON.parse(localStorage.getItem(storage))}catch(e){}if(!db||!db.sessions)db={machine:'サンブレイク',configs:{},sessions:{}};let digits='';let currentTab='memo';function machine(){return db.machine}function conf(){return db.configs[machine()]||defaults[machine()]}function session(){return db.sessions[machine()]||(db.sessions[machine()]={events:[],segments:[],state:'通常',open:{}})}function save(){try{localStorage.setItem(storage,JSON.stringify(db));document.getElementById('toast').textContent='保存済'}catch(e){document.getElementById('toast').textContent='保存失敗'}}function appendG(n){digits=(digits+n).slice(-6);renderG()}function clearG(){digits='';renderG()}function renderG(){document.getElementById('g').textContent=digits||'0'}function add(token){if(!token)return;let s=session();s.events.push({g:Number(digits||0),token,state:s.state,time:Date.now()});save();render()}function undo(){let s=session();if(!s.events.length)return;s.events.pop();save();render()}function setState(st){let s=session();if(st===s.state){s.state='通常';s.events.push({g:Number(digits||0),token:']',state:st,time:Date.now()})}else{if(s.state!=='通常')s.events.push({g:Number(digits||0),token:']',state:s.state,time:Date.now()});s.state=st;if(st!=='通常')s.events.push({g:Number(digits||0),token:(st==='高確'?'↑':st==='超高確'?'超高':st==='前兆'?'前兆':'不明')+'[',state:st,time:Date.now()})}save();render()}function segment(type){let s=session(),g=Number(digits||0);if(s.open[type]!=null){let idx=s.open[type];s.segments[idx].end=g;delete s.open[type];s.events.push({g,token:type+'終了',state:s.state,time:Date.now()})}else{let idx=s.segments.length;s.segments.push({type,start:g,end:null});s.open[type]=idx;s.events.push({g,token:type+'開始',state:s.state,time:Date.now()})}save();render()}
function render(){let s=session();document.getElementById('statusLabel').textContent=s.state;let out='',last=null;for(const e of s.events){if(last===e.g)out+=e.token;else out+=(out?' ':'')+e.g+e.token;last=e.g}document.getElementById('memo').textContent=out||'ゲーム数を入力してボタンを押すと、ここに横書きで記録されます。';document.getElementById('segments').innerHTML=s.segments.map((v,i)=>'<p>'+ (i+1)+'. '+v.type+' '+v.start+'G → '+(v.end==null?'進行中':v.end+'G（'+(v.end-v.start)+'G）')+'</p>').join('')||'<p>区間記録なし</p>';let counts={};for(const e of s.events){if(!counts[e.token])counts[e.token]={all:0,states:{}};counts[e.token].all++;counts[e.token].states[e.state]=(counts[e.token].states[e.state]||0)+1}document.getElementById('stats').innerHTML=Object.entries(counts).filter(([k])=>!k.includes('[')&&k!==']').map(([k,v])=>'<div style="padding:5px;border-bottom:1px solid #eee">'+escapeHtml(k)+'：'+v.all+'回 <span class="muted">'+Object.entries(v.states).map(([st,n])=>escapeHtml(st)+':'+n).join(' / ')+'</span></div>').join('')||'まだ記録がありません';renderButtons()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderButtons(){let c=conf(),s=session();document.getElementById('tokens').innerHTML='';for(const t of c.tokens){let b=document.createElement('button');b.textContent=t;b.onclick=()=>add(t);document.getElementById('tokens').append(b)}document.getElementById('states').innerHTML='';for(const t of c.states){let b=document.createElement('button');b.textContent=t;b.className=s.state===t?'active':'';b.onclick=()=>setState(t);document.getElementById('states').append(b)}}function tab(t){currentTab=t;for(const k of ['memo','cz','stats','config'])document.getElementById(k+'Pane').classList.toggle('hidden',k!==t);if(t==='config'){document.getElementById('tokenConfig').value=conf().tokens.join(',');document.getElementById('stateConfig').value=conf().states.join(',')}render()}function saveConfig(){let tokens=document.getElementById('tokenConfig').value.split(',').map(s=>s.trim()).filter(Boolean),states=document.getElementById('stateConfig').value.split(',').map(s=>s.trim()).filter(Boolean);if(!tokens.length||!states.length)return alert('ボタンを1つ以上指定してください');db.configs[machine()]={tokens,states};save();render();alert('保存しました')}function newSession(){if(!confirm('この機種の現在の実戦を消去して新規開始しますか？ バックアップ推奨です。'))return;db.sessions[machine()]={events:[],segments:[],state:'通常',open:{}};save();render()}function resetMachine(){if(!confirm('この機種のボタン設定を初期化しますか？'))return;delete db.configs[machine()];save();tab('config')}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportData(){download('slot-memo-backup.json',JSON.stringify(db,null,2),'application/json')}function exportText(){let s=session(),last=null,out='';for(const e of s.events){out+=(last===e.g?'':'\n'+e.g)+e.token;last=e.g}download('slot-memo.txt',out.trim(),'text/plain;charset=utf-8')}function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!obj.sessions||!obj.configs)throw Error();if(!confirm('現在の保存データをバックアップ内容で置き換えますか？'))return;db=obj;document.getElementById('machine').value=db.machine;save();render()}catch(e){alert('読み込みできないファイルです')}};r.readAsText(f)}document.getElementById('machine').value=db.machine;document.getElementById('machine').onchange=e=>{db.machine=e.target.value;save();render()};function keyPress(n){if(n==='C')digits='';else if(n==='⌫')digits=digits.slice(0,-1);else digits=(digits+n).slice(-6);renderG()}render();</script></body></html>
