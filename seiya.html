function exp(){var o=[],nb=[],ab=null;
function fl(end){o.push('AT'+ab.n);o.push(ab.h);o.push(' ↓');for(var k=0;k<ab.ls.length;k++)o.push(ab.ls[k]);if(end)o.push(end);if(ab.pre.length)o.push('('+ab.pre.join(' ')+')');o.push('---');ab=null;}

if(e.k=='as'){if(ab)fl('');ab={n:e.n,h:e.t,ls:[],pre:nb};nb=[];}
else if(e.k=='ae'&&ab)fl(e.t);

else nb.push(e.t);}
